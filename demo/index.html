<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Aurora Grid — document assistant</title>
<style>
  :root{
    --ink:#0d1b2a; --ink-2:#33475b; --ink-3:#6b7f95;
    --line:#e2e8f0; --line-2:#cbd5e1;
    --bg:#f6f8fb; --card:#ffffff;
    --brand:#0b6e4f; --brand-2:#0f8a63; --brand-soft:#e8f5f0;
    --amber:#b45309; --amber-soft:#fef3e2;
    --blue:#1d4ed8; --blue-soft:#eaf0fe;
    --radius:16px;
    --shadow:0 1px 2px rgba(13,27,42,.06), 0 8px 24px -12px rgba(13,27,42,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 80px}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(140deg,#0d1b2a 0%,#14324a 55%,#0b6e4f 140%);
    color:#fff; padding:30px 0 28px; margin-bottom:24px;
  }
  .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#22c58b,#0b6e4f);
    display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(34,197,139,.8);flex:0 0 auto}
  .mark svg{width:21px;height:21px}
  .brand-name{font-weight:650;letter-spacing:.2px;font-size:16px}
  .brand-sub{font-size:12.5px;opacity:.72;margin-top:1px}
  header h1{font-size:clamp(24px,3.2vw,34px);line-height:1.18;margin:0 0 10px;font-weight:680;letter-spacing:-.5px}
  header p{margin:0;opacity:.86;font-size:15.5px;max-width:640px}
  .flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .flag{font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.11);
    border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:#22c58b;box-shadow:0 0 0 3px rgba(34,197,139,.22)}
  .dot.off{background:#94a3b8;box-shadow:none}

  /* language toggle */
  .lang{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:10px;padding:3px;flex:0 0 auto}
  .lang button{
    font:inherit;font-size:13px;font-weight:640;border:0;background:transparent;color:rgba(255,255,255,.78);
    padding:6px 13px;border-radius:7px;cursor:pointer;transition:all .15s;line-height:1.2;
  }
  .lang button.on{background:#fff;color:#0b6e4f}
  .lang button:hover:not(.on){color:#fff}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin-bottom:18px}

  /* ---------- ask ---------- */
  .askrow{display:flex;gap:10px}
  #q{flex:1;min-width:0;font-size:17px;padding:15px 16px;border:1.5px solid var(--line-2);border-radius:12px;
    font-family:inherit;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s}
  #q:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(15,138,99,.12)}
  #go{font-size:16px;font-weight:640;padding:15px 28px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(140deg,var(--brand-2),var(--brand));color:#fff;white-space:nowrap;
    transition:filter .15s,transform .1s;box-shadow:0 6px 16px -8px rgba(11,110,79,.9);
    pointer-events:auto;flex:0 0 auto}
  #go:hover:not(:disabled){filter:brightness(1.08)}
  #go:active:not(:disabled){transform:translateY(1px)}
  #go:disabled{opacity:.55;cursor:not-allowed}
  .hint{font-size:13px;color:var(--ink-3);margin-top:11px}

  /* ---------- pipeline ---------- */
  #pipeline{display:none}
  .pipe{display:flex;flex-direction:column;gap:2px}
  .pstep{display:flex;align-items:flex-start;gap:13px;padding:11px 0;position:relative}
  .pstep:not(:last-child)::after{content:"";position:absolute;left:13px;top:38px;bottom:-2px;width:2px;background:var(--line)}
  .pstep.done:not(:last-child)::after{background:#b7e4d2}
  .pdot{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:#fff;border:2px solid var(--line-2);color:var(--ink-3);font-size:12.5px;font-weight:700;z-index:1}
  .pstep.active .pdot{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
  .pstep.done .pdot{border-color:#22c58b;background:#22c58b;color:#fff}
  .pbody{flex:1;min-width:0;padding-top:2px}
  .ptitle{font-size:15px;font-weight:620;color:var(--ink-2)}
  .pstep.active .ptitle{color:var(--brand)}
  .pstep.pending .ptitle{color:var(--ink-3)}
  .pdetail{font-size:13px;color:var(--ink-3);margin-top:3px}
  .pspin{width:15px;height:15px;border:2.5px solid var(--brand-soft);border-top-color:var(--brand-2);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tick{font-size:14px;line-height:1}

  /* mini source previews shown during retrieval */
  .preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin-top:11px}
  .pcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fbfdfe;
    animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pcard .pt{font-size:13px;font-weight:640;color:var(--ink-2);margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .pp{font-size:12.5px;color:var(--ink-3);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .score{display:flex;align-items:center;gap:6px;margin-top:7px}
  .bar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c58b,var(--brand));border-radius:99px;
    transition:width .5s ease}
  .pct{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ---------- answer ---------- */
  #answer{display:none}
  .alabel{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-3);font-weight:640;margin-bottom:12px}
  .atext{font-size:18px;line-height:1.62;color:var(--ink);white-space:pre-wrap}
  .atext strong{font-weight:660}
  .qecho{font-size:14px;color:var(--ink-3);margin-bottom:14px;padding-bottom:14px;
    border-bottom:1px solid var(--line)}
  .qecho b{color:var(--ink-2);font-weight:620}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
  .meta b{color:var(--ink-2);font-weight:620}

  /* ---------- sources ---------- */
  #sources{display:none}
  .src{border-bottom:1px solid var(--line)}
  .src:last-child{border-bottom:0}
  .srchead{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer}
  .srchead:hover .srctitle{color:var(--brand)}
  .rank{width:23px;height:23px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
    display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
  .srctitle{font-size:15px;font-weight:600;color:var(--ink-2);flex:1;transition:color .14s}
  .sbar{width:96px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:0 0 auto}
  .sbar i{display:block;height:100%;background:linear-gradient(90deg,#22c58b,var(--brand));border-radius:99px}
  .spct{font-size:12.5px;color:var(--ink-3);width:42px;text-align:right;flex:0 0 auto;
    font-variant-numeric:tabular-nums}
  .chev{color:var(--ink-3);transition:transform .18s;flex:0 0 auto}
  .src.open .chev{transform:rotate(90deg)}
  .passage{display:none;font-size:14.5px;line-height:1.68;color:var(--ink-2);
    background:#f8fafc;border:1px solid var(--line);border-radius:11px;
    padding:14px 16px;margin:0 0 14px;white-space:pre-wrap;max-height:340px;overflow:auto}
  .src.open .passage{display:block}

  /* ---------- examples ---------- */
  .ex h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
    margin:18px 0 9px;font-weight:640}
  .ex h3:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);
    background:#fff;color:var(--ink-2);cursor:pointer;text-align:left;font-family:inherit;
    transition:all .14s;line-height:1.4}
  .chip:hover{border-color:var(--brand-2);color:var(--brand);background:var(--brand-soft)}
  .chip.hero{border-color:#f0c894;background:var(--amber-soft);color:var(--amber)}
  .chip.hero:hover{background:#fde9cf;border-color:#e0a95f}

  /* ---------- collapsible sections ---------- */
  details.sect{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:0 22px;box-shadow:var(--shadow);margin-bottom:18px}
  details.sect>summary{cursor:pointer;padding:18px 0;font-weight:620;font-size:15px;
    list-style:none;display:flex;align-items:center;gap:10px}
  details.sect>summary::-webkit-details-marker{display:none}
  details.sect>summary::before{content:"›";font-size:20px;color:var(--ink-3);
    transition:transform .18s;display:inline-block;line-height:1}
  details.sect[open]>summary::before{transform:rotate(90deg)}
  details.sect .body{padding:0 0 20px;font-size:14.5px;color:var(--ink-2);line-height:1.68}
  .count{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-left:auto}

  /* ---------- document library ---------- */
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}
  .doc{border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;
    transition:all .14s;background:#fff}
  .doc:hover{border-color:var(--brand-2);box-shadow:0 4px 14px -8px rgba(11,110,79,.5)}
  .doc .dt{font-size:14px;font-weight:640;color:var(--ink-2);margin-bottom:5px}
  .doc .dw{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
  .doc .dp{font-size:12.5px;color:var(--ink-3);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;
    align-items:center;justify-content:center;padding:28px;z-index:60}
  #modal.on{display:flex}
  .sheet{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:84vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
  .sheet header{background:#fff;color:var(--ink);padding:20px 24px;margin:0;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .sheet h2{margin:0;font-size:18px;font-weight:660}
  .sheet .dsub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .x{border:0;background:var(--bg);width:32px;height:32px;border-radius:9px;cursor:pointer;
    font-size:17px;color:var(--ink-2);line-height:1;flex:0 0 auto}
  .x:hover{background:var(--line)}
  .sheet .content{padding:22px 24px;overflow:auto;font-size:14.5px;line-height:1.72;
    white-space:pre-wrap;color:var(--ink-2)}

  .note{background:var(--amber-soft);border:1px solid #f2d6a8;border-left:4px solid #e0a95f;
    border-radius:11px;padding:14px 16px;font-size:14.5px;color:#6b4408;margin-top:14px;line-height:1.6}
  .chain{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0 16px;font-size:13px}
  .cstep{background:var(--brand-soft);color:var(--brand);padding:7px 12px;border-radius:9px;
    font-weight:620;border:1px solid #cfe9df}
  .arrow{color:var(--ink-3)}
  footer{text-align:center;font-size:13px;color:var(--ink-3);margin-top:30px;line-height:1.7}
  @media (max-width:620px){
    .askrow{flex-direction:column}
    #go{width:100%}
    .toprow{flex-direction:column}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="toprow">
      <div>
        <div class="brand">
          <div class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
          </div>
          <div>
            <div class="brand-name">Aurora Grid Systems</div>
            <div class="brand-sub" data-i18n="brand_sub"></div>
          </div>
        </div>
      </div>
      <div class="lang">
        <button type="button" data-lang="en" class="on">EN</button>
        <button type="button" data-lang="vi">VI</button>
      </div>
    </div>
    <h1 data-i18n="h1"></h1>
    <p data-i18n="sub"></p>
    <div class="flags">
      <span class="flag"><span class="dot" id="dot-relay"></span><span data-i18n="flag_model"></span></span>
      <span class="flag"><span class="dot"></span><span id="flag-docs" data-i18n="flag_docs"></span></span>
      <span class="flag" data-i18n="flag_private"></span>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ask -->
  <div class="card">
    <div class="askrow">
      <input id="q" type="text" autocomplete="off" spellcheck="false">
      <button type="button" id="go" data-i18n="ask"></button>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </div>

  <!-- live pipeline -->
  <div class="card" id="pipeline">
    <div class="alabel" data-i18n="pipeline"></div>
    <div class="pipe" id="pipesteps"></div>
  </div>

  <!-- answer -->
  <div class="card" id="answer"></div>

  <!-- sources -->
  <div class="card" id="sources">
    <div class="alabel" data-i18n="sources"></div>
    <div id="srclist"></div>
    <div class="hint" data-i18n="sources_hint"></div>
  </div>

  <!-- examples -->
  <details class="sect ex" open>
    <summary><span data-i18n="trythese"></span></summary>
    <div class="body" id="examples"></div>
  </details>

  <!-- document library -->
  <details class="sect">
    <summary><span data-i18n="library"></span><span class="count" id="libcount"></span></summary>
    <div class="body">
      <p style="margin-top:0" data-i18n="library_sub"></p>
      <div class="docs" id="doclist"></div>
    </div>
  </details>

  <!-- how it works -->
  <details class="sect">
    <summary><span data-i18n="how"></span></summary>
    <div class="body">
      <p data-i18n="how_p1"></p>
      <div class="chain">
        <span class="cstep" data-i18n="chain1"></span><span class="arrow">→</span>
        <span class="cstep" data-i18n="chain2"></span><span class="arrow">→</span>
        <span class="cstep" data-i18n="chain3"></span><span class="arrow">→</span>
        <span class="cstep" data-i18n="chain4"></span>
      </div>
      <p data-i18n="how_p2"></p>
      <div class="note" data-i18n="how_note"></div>
      <p style="margin-bottom:0" data-i18n="how_p3"></p>
    </div>
  </details>

  <footer><span data-i18n="footer1"></span><br><span data-i18n="footer2"></span></footer>
</div>

<!-- document preview modal -->
<div id="modal">
  <div class="sheet">
    <header>
      <div>
        <h2 id="mtitle"></h2>
        <div class="dsub" id="msub"></div>
      </div>
      <button type="button" class="x" id="mclose">✕</button>
    </header>
    <div class="content" id="mtext"></div>
  </div>
</div>

<script>
'use strict';

/* ======================= i18n ======================= */
const I18N = {

    total: 'tổng {s} giây',
    via: 'truy xuất qua {v}',
    via_sandbox: 'sandbox NemoClaw',
    via_local: 'chỉ mục cục bộ',
    trythese: 'Thử các câu hỏi sau',
    library: 'Thư viện tài liệu',
    library_sub: 'Toàn bộ tài liệu mà trợ lý được phép đọc. Bấm vào một tài liệu để xem trước.',
    how: 'Cách hoạt động — và vì sao có thể tin được',
    how_p1: 'Câu hỏi của bạn được chuyển thành một vector số và so sánh với từng phần của toàn bộ tài liệu. Những đoạn gần nhất được đưa cho mô hình ngôn ngữ chạy ngay trên máy này, và mô hình chỉ viết câu trả lời dựa trên những đoạn đó.',
    chain1: 'Câu hỏi của bạn', chain2: 'Tìm trong mọi tài liệu',
    chain3: 'Các đoạn khớp nhất', chain4: 'Câu trả lời + nguồn',
    how_p2: 'Hệ thống không thể bịa từ internet, vì nó không hề truy cập internet. Nếu tài liệu không có câu trả lời, nó sẽ nói rõ điều đó.',
    how_note: 'Phần khó không phải là tìm văn bản tương tự — mà là biết văn bản nào còn đúng. Tài liệu của chúng tôi có một hướng dẫn an toàn đã bị thu hồi và thay thế. Cả hai phiên bản vẫn còn trong thư viện. Hãy hỏi về thời gian chờ khi ngắt DC và xem hệ thống trả lời bản nào.',
    how_p3: 'Hãy thử hỏi một điều mà tài liệu không đề cập, và xem hệ thống từ chối thay vì đoán bừa. Đó là khác biệt giữa một hệ thống dùng được và một hệ thống không dùng được.',
    footer1: 'Chỉ dùng cho mục đích trình diễn. Aurora Grid Systems là công ty hư cấu và tài liệu là dữ liệu tổng hợp.',
    footer2: 'Chạy cục bộ qua NemoClaw + OpenClaw với agent được sandbox.',
    words: 'từ',
    close: 'Đóng'
  }
};

let LANG = localStorage.getItem('aurora-lang') || 'en';
const t = (k, vars) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);
  return s;
};

const $ = s => document.querySelector(s);
const qEl = $('#q'), goEl = $('#go'), pipelineEl = $('#pipeline'),
      pipesteps = $('#pipesteps'), answerEl = $('#answer'),
      sourcesEl = $('#sources'), srcList = $('#srclist'),
      examplesEl = $('#examples'), doclistEl = $('#doclist');

let busy = false, DOC_COUNT = 28, EXAMPLES = null;

/* ======================= language ======================= */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (k === 'flag_docs') el.textContent = t(k, {n: DOC_COUNT});
    else el.textContent = t(k);
  });
  qEl.placeholder = t('placeholder');
  goEl.textContent = t('ask');
  document.querySelectorAll('.lang button').forEach(b =>
    b.classList.toggle('on', b.dataset.lang === LANG));
  renderExamples();
  if (LAST) renderAnswer(LAST);       // re-render the last answer in the new language
  if (LAST_SOURCES) renderSources(LAST_SOURCES, LAST_MAX);
}

document.querySelectorAll('.lang button').forEach(b => {
  b.addEventListener('click', () => {
    LANG = b.dataset.lang;
    localStorage.setItem('aurora-lang', LANG);
    applyLang();
  });
});

/* ======================= examples ======================= */
function renderExamples(){
  if (!EXAMPLES) return;
  const groups = EXAMPLES[LANG] || EXAMPLES.en;
  examplesEl.innerHTML = groups.map(g => `
    <h3>${esc(g.group)}</h3>
    <div class="chips">
      ${g.items.map(q => `<button type="button" class="chip${/disconnect|5-minute|ngắt DC|5 phút|chờ 5/.test(q) ? ' hero' : ''}"
        data-q="${esc(q)}">${esc(q)}</button>`).join('')}
    </div>`).join('');
  examplesEl.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { qEl.value = c.dataset.q; ask(); }));
}

/* ======================= health / library ======================= */
async function health(){
  try{
    const h = await (await fetch('/api/health')).json();
    $('#dot-relay').className = 'dot' + (h.relay ? '' : ' off');
    if (h.doc_count) { DOC_COUNT = h.doc_count; applyLang(); }
  }catch(e){ $('#dot-relay').className = 'dot off'; }
}

async function loadLibrary(){
  try{
    const d = await (await fetch('/api/corpus')).json();
    const docs = d.documents || [];
    DOC_COUNT = docs.length || DOC_COUNT;
    $('#libcount').textContent = docs.length;
    doclistEl.innerHTML = docs.map(x => `
      <div class="doc" data-doc="${esc(x.doc)}">
        <div class="dt">${esc(x.title)}</div>
        <div class="dw">${x.words} ${t('words')}</div>
        <div class="dp">${esc(x.preview)}</div>
      </div>`).join('');
    doclistEl.querySelectorAll('.doc').forEach(el =>
      el.addEventListener('click', () => openDoc(el.dataset.doc)));
    applyLang();
  }catch(e){ /* library is optional */ }
}

async function openDoc(name){
  try{
    const d = await (await fetch('/api/doc?name=' + encodeURIComponent(name))).json();
    $('#mtitle').textContent = d.title || name;
    $('#msub').textContent = d.doc || '';
    $('#mtext').textContent = stripMd(d.text || '');
    $('#modal').classList.add('on');
  }catch(e){}
}
function closeModal(){ $('#modal').classList.remove('on'); }
$('#mclose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ======================= helpers ======================= */
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripMd(s){
  return String(s || '')
    .replace(/^---[\s\S]*?---/m, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^\s*\|.*\|\s*$/gm, '')
    .replace(/\n{3,}/g, '\n\n').trim();
}
function fmt(s){
  return esc(stripMd(s)).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

/* ======================= pipeline display ======================= */
const STEPS = ['search', 'found', 'rank', 'generate', 'done'];
function paintPipeline(activeId, detail){
  pipesteps.innerHTML = STEPS.map(id => {
    const idx = STEPS.indexOf(id), cur = STEPS.indexOf(activeId);
    const state = idx < cur ? 'done' : idx === cur ? 'active' : 'pending';
    if (state === 'pending' && id === 'rank') return '';   // folded into 'found'
    const title = t('step_' + id, {n: DOC_COUNT, s: (detail && detail.s) || ''});
    const desc  = t('step_' + id + '_d', {n: DOC_COUNT, s: (detail && detail.s) || ''});
    const icon  = state === 'done' ? '<span class="tick">✓</span>'
                : state === 'active' ? '<div class="pspin"></div>' : (idx + 1);
    const showDesc = state !== 'pending' && desc !== ('step_' + id + '_d');
    return `<div class="pstep ${state}">
        <div class="pdot">${icon}</div>
        <div class="pbody">
          <div class="ptitle">${esc(title)}</div>
          ${showDesc ? `<div class="pdetail">${esc(desc)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

/* ======================= ask ======================= */
let LAST = null, LAST_SOURCES = null, LAST_MAX = 1;

async function ask(){
  const question = qEl.value.trim();
  if (!question){ qEl.focus(); return; }
  if (busy) return;

  busy = true;
  goEl.disabled = true;
  LAST = null; LAST_SOURCES = null;
  sourcesEl.style.display = 'none';
  answerEl.style.display = 'none';

  pipelineEl.style.display = 'block';
  paintPipeline('search');
  // Keep the ask box and the running pipeline in view — the answer arrives
  // below and must not land off-screen.
  pipelineEl.scrollIntoView({behavior: 'smooth', block: 'start'});

  let failed = false;
  try{
    const res = await fetch('/api/ask/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, lang: LANG, k: 5})
    });
    if (!res.ok || !res.body) throw new Error('bad response');

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines){
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch(e){ continue; }
        handleEvent(ev);
      }
    }
  }catch(err){
    failed = true;
  }

  if (failed){
    pipelineEl.style.display = 'none';
    answerEl.style.display = 'block';
    answerEl.innerHTML = `<div class="alabel">${esc(t('answer'))}</div>
      <div class="atext">${esc(t('unreach'))}</div>`;
  }

  busy = false;
  goEl.disabled = false;
}

function handleEvent(ev){
  if (ev.event === 'step'){
    paintPipeline(ev.id);
  }
  else if (ev.event === 'retrieved'){
    LAST_SOURCES = ev.sources || [];
    LAST_MAX = Math.max(...LAST_SOURCES.map(s => s.score), 0.0001);
    paintPipeline('found', {s: ev.seconds});
    renderSources(LAST_SOURCES, LAST_MAX);
    // Show the retrieved passages immediately, before the answer is written.
    answerEl.style.display = 'block';
    answerEl.innerHTML = `<div class="alabel">${esc(t('answer'))}</div>
      <div class="pdetail">${esc(t('step_generate_d'))}</div>`;
  }
  else if (ev.event === 'answer'){
    pipelineEl.style.display = 'none';
    LAST = ev;
    renderAnswer(ev);
    answerEl.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  else if (ev.event === 'error'){
    pipelineEl.style.display = 'none';
    answerEl.style.display = 'block';
    answerEl.innerHTML = `<div class="alabel">${esc(t('answer'))}</div>
      <div class="atext">${esc(t('unreach'))}</div>`;
  }
}

function renderAnswer(d){
  const via = d.source === 'sandbox' ? t('via_sandbox')
            : d.source === 'local-index' ? t('via_local') : '—';
  let body;
  if (d.error) body = t('unreach2');
  else if (!d.answer || !d.answer.trim()) body = t('noanswer');
  else body = fmt(d.answer);

  answerEl.style.display = 'block';
  answerEl.innerHTML = `
    <div class="alabel">${esc(t('answer'))}</div>
    <div class="qecho"><b>${esc(t('youasked'))}</b> ${esc(d._q || qEl.value.trim())}</div>
    <div class="atext">${body}</div>
    <div class="meta">
      <span>${esc(t('docs_used', {n: (d.sources || []).length, s: (d.sources || []).length === 1 ? '' : 's'}))}</span>
      <span>${esc(t('total', {s: d.seconds}))}</span>
      <span>${esc(t('via', {v: via}))}</span>
    </div>`;
}

function renderSources(list, max){
  if (!list || !list.length){ sourcesEl.style.display = 'none'; return; }
  srcList.innerHTML = list.map((s, i) => {
    const pct = Math.max(6, Math.round((s.score / max) * 100));
    return `<div class="src">
      <div class="srchead">
        <span class="rank">${i + 1}</span>
        <span class="srctitle">${esc(s.title)}</span>
        <span class="sbar"><i style="width:${pct}%"></i></span>
        <span class="spct">${(s.score * 100).toFixed(0)}%</span>
        <span class="chev">›</span>
      </div>
      <div class="passage">${esc(s.passage)}</div>
    </div>`;
  }).join('');
  srcList.querySelectorAll('.src').forEach(el =>
    el.querySelector('.srchead').addEventListener('click', () => el.classList.toggle('open')));
  sourcesEl.style.display = 'block';
}

/* ======================= wire up ======================= */
// addEventListener (not .onclick) and type="button" so nothing can intercept it.
goEl.addEventListener('click', ask);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); ask(); } });

(async function init(){
  applyLang();
  try{
    EXAMPLES = (await (await fetch('/api/examples')).json()).examples;
  }catch(e){ EXAMPLES = {en: [], vi: []}; }
  renderExamples();
  health();
  loadLibrary();
})();
</script>
